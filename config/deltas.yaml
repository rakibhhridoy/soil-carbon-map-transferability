# MDBC candidate delta registry (Stage 0)
# bbox = [lon_min, lat_min, lon_max, lat_max]  (EPSG:4326, generous analysis window).
# Operative mangrove footprint = GMW v3 2020 extent clipped to bbox.
# tier1 = expected core/LODO fold; tier2 = candidate pending GMW area + label check.
# `role` and `mangrove_area_km2` are filled by src/build_delta_registry.py.

crs: EPSG:4326
area_crs: EPSG:6933        # World Cylindrical Equal Area, for area & stock accounting

deltas:
